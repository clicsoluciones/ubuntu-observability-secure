# Incluir dentro del contexto http {} de /etc/nginx/nginx.conf.
# Luego, en cada server {} que quieras monitorear, configura:
# access_log /var/log/nginx/access.log observability_json;

log_format observability_json escape=json
  '{"remote_addr":"$remote_addr",'
  '"status":$status,'
  '"request_uri":"$request_uri",'
  '"http_user_agent":"$http_user_agent",'
  '"request_time":$request_time,'
  '"request_method":"$request_method",'
  '"host":"$host"}';
