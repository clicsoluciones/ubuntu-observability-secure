global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Alloy entrega las métricas del host mediante remote_write.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Endpoint de métricas de CrowdSec; si no está habilitado, el target quedará DOWN.
  - job_name: crowdsec
    static_configs:
      - targets: ["127.0.0.1:6060"]
