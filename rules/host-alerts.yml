groups:
  - name: host-health
    interval: 1m
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels: { severity: warning, category: resources }
        annotations:
          summary: "CPU por encima del 85%"
          description: "Uso de CPU superior al 85% durante 5 minutos."

      - alert: HostCriticalMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels: { severity: critical, category: resources }
        annotations:
          summary: "Memoria RAM por encima del 90%"
          description: "Memoria usada superior al 90% durante 5 minutos."

      - alert: HostDiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"^/(snap|var/lib/docker/overlay2|run|sys|dev).*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"^/(snap|var/lib/docker/overlay2|run|sys|dev).*",node_filesystem_size_bytes>0})) * 100 > 85
        for: 10m
        labels: { severity: warning, category: resources }
        annotations:
          summary: "Sistema de archivos por encima del 85%"
          description: "Almacenamiento usado superior al 85% durante 10 minutos."

      - alert: HostDiskIOHigh
        expr: rate(node_disk_io_time_seconds_total[5m]) * 100 > 80
        for: 5m
        labels: { severity: warning, category: resources }
        annotations:
          summary: "Actividad de I/O de disco elevada"
          description: "Tiempo de I/O superior al umbral configurado durante 5 minutos."

      - alert: CriticalSystemdServiceDown
        expr: node_systemd_unit_state{name=~"(ssh|sshd|nginx|crowdsec)\\.service",state="active"} == 0
        for: 1m
        labels: { severity: critical, category: availability }
        annotations:
          summary: "Servicio crítico inactivo"
          description: "Una unidad systemd monitorizada no está activa."

  - name: network-security
    interval: 1m
    rules:
      - alert: SynCookiesSent
        expr: rate(node_netstat_TcpExt_SyncookiesSent[1m]) > 0
        for: 1m
        labels: { severity: warning, category: network }
        annotations:
          summary: "El kernel está enviando SYN cookies"
          description: "Se detectó actividad SYN cookies. No confirma por sí sola un DDoS."

      - alert: TCPInboundOutboundAsymmetry
        expr: (rate(node_netstat_Tcp_InSegs[2m]) / clamp_min(rate(node_netstat_Tcp_OutSegs[2m]), 1)) > 5
        for: 2m
        labels: { severity: warning, category: network }
        annotations:
          summary: "Asimetría elevada de segmentos TCP"
          description: "La relación de segmentos entrantes/salientes supera 5."

      - alert: ConntrackUsageHigh
        expr: (node_nf_conntrack_entries / node_nf_conntrack_entries_limit) * 100 > 80
        for: 2m
        labels: { severity: critical, category: network }
        annotations:
          summary: "Conntrack por encima del 80%"
          description: "La tabla de seguimiento de conexiones se aproxima al límite."

      - alert: CrowdSecActiveDecisionsHigh
        expr: cs_active_decisions > 50
        for: 1m
        labels: { severity: warning, category: ips }
        annotations:
          summary: "CrowdSec registra más de 50 decisiones activas"
          description: "Revisa CrowdSec y correlaciona las decisiones con los registros de acceso."
